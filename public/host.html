<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shadow Arcade</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@600;800;900&display=swap">
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden}
  canvas{display:block;cursor:default}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="js/core.js"></script>
<script>
// Auto-import: every .js file inside public/js/games/ is loaded (files starting with "_" are skipped).
// To add a game: drop a file into public/js/games/ and restart/refresh. No other edits needed.
fetch('/games.json').then(r => r.json()).then(list => {
  let i = 0;
  (function next() {
    if (i >= list.length) return;
    const s = document.createElement('script');
    s.src = 'js/games/' + list[i++];
    s.onload = next;
    s.onerror = () => { console.error('Game failed to load:', s.src); next(); };
    document.body.appendChild(s);
  })();
}).catch(e => console.error('games.json failed', e));
</script>
</body>
</html>
