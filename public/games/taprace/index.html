<!doctype html>
<html><head><meta charset="utf-8"><title>Tap Race</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  html,body{margin:0;height:100%;background:#0a0620;color:#fff;font-family:Mukta,system-ui,sans-serif;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
  #wrap{position:absolute;inset:4% 5%;display:flex;flex-direction:column;gap:1.4vh}
  h1{margin:0 0 .5vh;text-align:center;font-size:4.2vh;letter-spacing:.3vh;text-shadow:0 0 2vh #ffd400}
  .lane{flex:1;position:relative;border-radius:5vh;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,.12));border:.3vh solid rgba(255,255,255,.15);display:flex;align-items:center;min-height:0}
  .lane .name{position:absolute;left:2vh;font-weight:800;font-size:3vh;z-index:2;color:#fff;text-shadow:0 .2vh .8vh #000}
  .lane .bar{position:absolute;left:0;top:0;bottom:0;border-radius:5vh;width:0;opacity:.85;box-shadow:0 0 3vh currentColor}
  .lane .car{position:absolute;top:50%;width:6vh;height:6vh;margin:-3vh 0 0 -3vh;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,currentColor);box-shadow:0 0 3vh currentColor;transition:left .05s linear}
  .finish{position:absolute;right:2%;top:-1vh;bottom:-1vh;width:1.2vh;background:repeating-linear-gradient(#fff 0 1.5vh,#000 1.5vh 3vh)}
</style></head>
<body>
<div id="wrap"><h1>TAP RACE — first to 60 taps!</h1><div id="lanes" style="display:contents"></div></div>
<script src="/sdk.js"></script>
<script>
  // A complete HTML game in ~25 lines: only /sdk.js is needed.
  var GOAL = 60, lanes = [], taps = [], done = false;
  Arcade.onStart(function (players) {
    var box = document.getElementById('lanes');
    players.forEach(function (p, i) {
      var d = document.createElement('div'); d.className = 'lane'; d.style.color = p.color;
      d.innerHTML = '<div class="bar" style="background:' + p.color + '"></div><div class="name"></div><div class="car"></div><div class="finish"></div>';
      d.querySelector('.name').textContent = p.name; box.appendChild(d);
      lanes.push({ bar: d.querySelector('.bar'), car: d.querySelector('.car') }); taps.push(0);
    });
    // direct screen-touch: tapping anywhere on this screen = player 0's tap
    if (players[0] && players[0].touch) {
      document.addEventListener('pointerdown', function (e) { if (e.pointerType !== 'mouse') Arcade.tap(0); });
    }
  });
  Arcade.onFrame(function (ps) {
    if (done) return;
    ps.forEach(function (p, i) {
      if (p.hit.a) { taps[i]++; Arcade.sfx('kick'); }
      var pct = Math.min(100, taps[i] / GOAL * 100);
      lanes[i].bar.style.width = pct + '%'; lanes[i].car.style.left = 'calc(' + pct * 0.93 + '% + 3vh)';
      if (taps[i] >= GOAL && !done) {
        done = true; Arcade.vibrate(i, 300);
        var players = Arcade.players, order = players.map(function (q, k) { return k; }).sort(function (a, b) { return taps[b] - taps[a]; });
        Arcade.end({ title: players[i].name + ' WINS!', color: players[i].color, sub: 'First to ' + GOAL + ' taps',
          lines: order.map(function (k) { return { name: players[k].name, color: players[k].color, text: taps[k] + ' taps' }; }) });
      }
    });
  });
</script></body></html>
