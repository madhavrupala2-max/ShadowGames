<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Ashen Duel</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #09070a;
      color: #fff;
      font-family: Mukta, system-ui, sans-serif;
      overflow: hidden;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
<canvas id="c" width="1280" height="720"></canvas>
<script src="/sdk.js"></script>
<script>
  var canvas = document.getElementById('c');
  var ctx = canvas.getContext('2d');
  var W = 1280, H = 720, CX = W / 2, CY = H / 2;
  var WIN_SCORE = 5;

  var me = [];
  var particles = [];
  var arenaRadius = 290;
  var roundPause = 0;
  var bannerText = '';

  function spawnParticles(x, y, color, count, speed) {
    for (var i = 0; i < count; i++) {
      var a = Math.random() * Math.PI * 2;
      var s = (0.3 + Math.random() * 0.7) * (speed || 220);
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(a) * s,
        vy: Math.sin(a) * s,
        color: color,
        life: 0.35 + Math.random() * 0.35,
        maxLife: 0.7,
        size: 3 + Math.random() * 4
      });
    }
  }

  function resetRound() {
    arenaRadius = 290;
    var count = me.length || 1;
    me.forEach(function (m, i) {
      var ang = (i / count) * Math.PI * 2;
      m.x = CX + Math.cos(ang) * 180;
      m.y = CY + Math.sin(ang) * 180;
      m.vx = 0;
      m.vy = 0;
      m.angle = ang + Math.PI;
      m.hp = 100;
      m.stamina = 100;
      m.stamCooldown = 0;
      m.state = 'idle'; // idle, windup, slash, recover, dash, stun, dead
      m.timer = 0;
      m.hitDealt = false;
    });
  }

  Arcade.onStart(function (players) {
    me = players.map(function (p, i) {
      return {
        index: i,
        x: CX,
        y: CY,
        vx: 0,
        vy: 0,
        angle: 0,
        color: p.color,
        name: p.name,
        score: 0,
        hp: 100,
        stamina: 100,
        stamCooldown: 0,
        state: 'idle',
        timer: 0,
        hitDealt: false
      };
    });
    resetRound();
  });

  Arcade.onFrame(function (ps, dt) {
    // Background Clear
    ctx.fillStyle = '#09070a';
    ctx.fillRect(0, 0, W, H);

    // Arena Cinder Ring Shrink
    if (roundPause <= 0 && arenaRadius > 115) {
      arenaRadius -= 6 * dt;
    }

    // Draw Arena Glow & Stone Circle
    var grad = ctx.createRadialGradient(CX, CY, arenaRadius * 0.8, CX, CY, arenaRadius + 60);
    grad.addColorStop(0, '#1c1721');
    grad.addColorStop(0.8, '#38160d');
    grad.addColorStop(1, '#09070a');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(CX, CY, arenaRadius + 55, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = '#18141c';
    ctx.beginPath();
    ctx.arc(CX, CY, arenaRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#ff4d00';
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.arc(CX, CY, arenaRadius, 0, Math.PI * 2);
    ctx.stroke();

    if (roundPause > 0) {
      roundPause -= dt;
      if (roundPause <= 0) resetRound();
    }

    // Update & Draw Fighters
    ps.forEach(function (p, i) {
      var m = me[i];
      if (!m) return;

      if (roundPause <= 0 && m.state !== 'dead') {
        // Stamina recovery
        if (m.stamCooldown > 0) {
          m.stamCooldown -= dt;
        } else if (m.state === 'idle') {
          m.stamina = Math.min(100, m.stamina + 28 * dt);
        }

        // State machine countdown
        if (m.timer > 0) {
          m.timer -= dt;
          if (m.timer <= 0) {
            if (m.state === 'windup') {
              m.state = 'slash';
              m.timer = 0.14;
              m.hitDealt = false;
              m.vx = Math.cos(m.angle) * 580;
              m.vy = Math.sin(m.angle) * 580;
            } else if (m.state === 'slash') {
              m.state = 'recover';
              m.timer = 0.2;
            } else {
              m.state = 'idle';
            }
          }
        }

        var mag = Math.hypot(p.x || 0, p.y || 0);

        if (m.state === 'idle') {
          if (mag > 0.15) {
            m.angle = Math.atan2(p.y, p.x);
            m.vx += p.x * 1600 * dt;
            m.vy += p.y * 1600 * dt;
          }

          var hitB = p.hit && (p.hit.b || p.hit.x);
          var hitA = p.hit && p.hit.a;

          // B: Ash Dodge Roll (i-frames)
          if (hitB && m.stamina >= 35) {
            m.stamina -= 35;
            m.stamCooldown = 0.65;
            m.state = 'dash';
            m.timer = 0.22;
            if (mag > 0.15) m.angle = Math.atan2(p.y, p.x);
            m.vx = Math.cos(m.angle) * 760;
            m.vy = Math.sin(m.angle) * 760;
            spawnParticles(m.x, m.y, '#888888', 10, 120);
          }
          // A: Ember Greatsword Slash
          else if (hitA && m.stamina >= 30) {
            m.stamina -= 30;
            m.stamCooldown = 0.85;
            if (mag > 0.15) m.angle = Math.atan2(p.y, p.x);
            m.state = 'windup';
            m.timer = 0.12;
          }
        }

        // Physics & Friction
        m.x += m.vx * dt;
        m.y += m.vy * dt;
        var drag = m.state === 'dash' ? 4 : 9;
        m.vx -= m.vx * drag * dt;
        m.vy -= m.vy * drag * dt;

        // Melee Hit Detection
        if (m.state === 'slash' && !m.hitDealt) {
          var hx = m.x + Math.cos(m.angle) * 60;
          var hy = m.y + Math.sin(m.angle) * 60;

          me.forEach(function (target, j) {
            if (i === j || target.state === 'dead' || target.state === 'dash') return;
            if (Math.hypot(target.x - hx, target.y - hy) < 48) {
              m.hitDealt = true;

              // Clash / Parry check
              if (target.state === 'slash' || target.state === 'windup') {
                m.state = 'stun';
                m.timer = 0.35;
                target.state = 'stun';
                target.timer = 0.35;
                var ang = Math.atan2(m.y - target.y, m.x - target.x);
                m.vx = Math.cos(ang) * 520;
                m.vy = Math.sin(ang) * 520;
                target.vx = -Math.cos(ang) * 520;
                target.vy = -Math.sin(ang) * 520;
                spawnParticles((m.x + target.x) / 2, (m.y + target.y) / 2, '#ffd000', 25, 280);
                Arcade.vibrate(i, 60);
                Arcade.vibrate(j, 60);
              } else {
                // Direct Slash Damage
                target.hp -= 34;
                target.state = 'stun';
                target.timer = 0.3;
                var kb = Math.atan2(target.y - m.y, target.x - m.x);
                target.vx = Math.cos(kb) * 680;
                target.vy = Math.sin(kb) * 680;
                spawnParticles(target.x, target.y, target.color, 22, 260);
                Arcade.vibrate(i, 40);
                Arcade.vibrate(j, 120);
              }
            }
          });
        }

        // Ring of Cinders Burn Damage
        if (Math.hypot(m.x - CX, m.y - CY) > arenaRadius) {
          m.hp -= 22 * dt;
          if (Math.random() < 0.25) spawnParticles(m.x, m.y, '#ff4500', 2, 90);
        }

        // Death Check
        if (m.hp <= 0) {
          m.hp = 0;
          m.state = 'dead';
          spawnParticles(m.x, m.y, '#ff3300', 35, 320);
          Arcade.vibrate(i, 250);
        }
      }

      // Draw Fighter
      if (m.state === 'dead') {
        ctx.fillStyle = '#3a3438';
        ctx.beginPath();
        ctx.arc(m.x, m.y, 18, 0, Math.PI * 2);
        ctx.fill();
        return;
      }

      // Slash Arc Visual
      if (m.state === 'slash') {
        ctx.save();
        ctx.translate(m.x, m.y);
        ctx.rotate(m.angle);
        ctx.strokeStyle = '#ffae00';
        ctx.lineWidth = 12;
        ctx.beginPath();
        ctx.arc(14, 0, 50, -1.1, 1.1);
        ctx.stroke();
        ctx.restore();
      }

      // Character Body & Sword
      ctx.save();
      ctx.translate(m.x, m.y);
      ctx.rotate(m.angle);

      var bladeAng = m.state === 'windup' ? -1.2 : m.state === 'slash' ? 1.1 : 0.4;
      ctx.save();
      ctx.rotate(bladeAng);
      ctx.fillStyle = m.state === 'windup' ? '#ff9900' : '#d8d2cb';
      ctx.fillRect(12, -4, 42, 8);
      ctx.restore();

      ctx.fillStyle = m.state === 'stun' ? '#ffffff' : m.state === 'dash' ? '#777777' : m.color;
      ctx.beginPath();
      ctx.arc(0, 0, 20, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Overhead Name & Bars
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 15px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(m.name + ' (' + m.score + ')', m.x, m.y - 42);

      // HP Bar
      ctx.fillStyle = '#331111';
      ctx.fillRect(m.x - 24, m.y - 34, 48, 6);
      ctx.fillStyle = '#e62e2e';
      ctx.fillRect(m.x - 24, m.y - 34, 48 * (m.hp / 100), 6);

      // Stamina Bar
      ctx.fillStyle = '#122615';
      ctx.fillRect(m.x - 24, m.y - 26, 48, 4);
      ctx.fillStyle = '#38d962';
      ctx.fillRect(m.x - 24, m.y - 26, 48 * (m.stamina / 100), 4);
    });

    // Update & Draw Particles
    for (var k = particles.length - 1; k >= 0; k--) {
      var pt = particles[k];
      pt.x += pt.vx * dt;
      pt.y += pt.vy * dt;
      pt.life -= dt;
      if (pt.life <= 0) {
        particles.splice(k, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, pt.life / pt.maxLife);
      ctx.fillStyle = pt.color;
      ctx.beginPath();
      ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Round End Resolution
    if (roundPause <= 0 && me.length > 0) {
      var alive = me.filter(function (m) { return m.state !== 'dead'; });
      if ((me.length > 1 && alive.length <= 1) || (me.length === 1 && alive.length === 0)) {
        if (alive.length === 1) {
          var w = alive[0];
          w.score++;
          bannerText = w.name.toUpperCase() + ' CLAIMS THE ASHES!';
          if (w.score >= WIN_SCORE) {
            return Arcade.end({
              title: w.name + ' WINS!',
              color: w.color,
              lines: me.map(function (q) {
                return { name: q.name, color: q.color, text: String(q.score) };
              })
            });
          }
        } else {
          bannerText = 'MUTUAL IMMOLATION!';
        }
        roundPause = 2.0;
      }
    }

    // UI Banners
    ctx.fillStyle = '#ff8c3b';
    ctx.font = 'bold 22px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('ASHEN DUEL — FIRST TO ' + WIN_SCORE + ' KILLS', CX, 34);

    if (roundPause > 0) {
      ctx.fillStyle = '#ffd27d';
      ctx.font = 'bold 38px sans-serif';
      ctx.fillText(bannerText, CX, CY);
    }
  });
</script>
</body>
</html>
